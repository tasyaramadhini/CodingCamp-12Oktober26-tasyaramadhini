<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A personal productivity dashboard with a to-do list, Pomodoro timer, quick links, and a live clock.">
  <title>ToDo Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========================================================
       TOP BAR
  ======================================================== -->
  <div class="dashboard" role="main">

    <header class="topbar" role="banner">
      <div class="topbar__brand" aria-label="ToDo Life Dashboard">
        <!-- Inline SVG icon — no external assets -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M9 12l2 2 4-4"/>
          <path d="M9 7h6M9 17h4"/>
        </svg>
        ToDo Life Dashboard
      </div>

      <div class="topbar__actions">
        <button class="theme-toggle" id="theme-toggle"
                aria-label="Toggle dark/light mode"
                title="Toggle dark/light mode">
          <span class="theme-toggle__thumb" aria-hidden="true">☀️</span>
        </button>
      </div>
    </header>

    <!-- ========================================================
         GRID
    ======================================================== -->
    <div class="grid">

      <!-- ── CLOCK ─────────────────────────────────────── -->
      <section class="card clock-card col-8" aria-label="Clock and greeting">
        <div class="card__title">🕐 Live Clock</div>

        <div class="clock__time" id="clock-time" aria-live="polite" aria-label="Current time">
          00:00:00
        </div>
        <div class="clock__date" id="clock-date" aria-live="polite" aria-label="Current date">
          Loading…
        </div>
        <div class="greeting-row">
          <div class="clock__greeting" id="clock-greeting" aria-live="polite">
            Good morning!
          </div>
          <button class="name-edit-btn" id="name-edit-btn"
                  aria-label="Edit your name in the greeting"
                  title="Personalise greeting">
            ✏️ Edit name
          </button>
        </div>
      </section>

      <!-- ── POMODORO ───────────────────────────────────── -->
      <section class="card col-4" aria-label="Pomodoro focus timer">
        <div class="card__title">🍅 Pomodoro Timer</div>

        <div class="pomodoro__display">
          <div class="pomodoro__timer" id="pomo-timer"
               aria-live="polite" aria-label="Timer countdown">
            25:00
          </div>
          <div class="pomodoro__label" id="pomo-label">Ready to focus?</div>
        </div>

        <!-- Progress bar -->
        <div class="pomodoro__progress-bar" role="progressbar"
             aria-label="Timer progress"
             aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <div class="pomodoro__progress-fill" id="pomo-progress-fill"></div>
        </div>

        <!-- Controls -->
        <div class="pomodoro__controls">
          <button class="btn btn--success" id="pomo-start"
                  aria-label="Start Pomodoro timer">
            ▶ Start
          </button>
          <button class="btn btn--neutral" id="pomo-pause" disabled
                  aria-label="Pause Pomodoro timer">
            ⏸ Pause
          </button>
          <button class="btn btn--neutral" id="pomo-reset" disabled
                  aria-label="Reset Pomodoro timer">
            ↺ Reset
          </button>
        </div>

        <!-- Duration setting -->
        <div class="pomodoro__settings">
          <label for="pomo-duration">Duration (min):</label>
          <input type="number" id="pomo-duration"
                 value="25" min="1" max="180"
                 aria-label="Set timer duration in minutes"
                 style="width:70px">
          <button class="btn btn--primary btn--sm" id="pomo-set-duration"
                  aria-label="Apply new timer duration">
            Set
          </button>
        </div>
      </section>

      <!-- ── TO-DO LIST ─────────────────────────────────── -->
      <section class="card col-8" aria-label="To-do task list">
        <div class="card__title">✅ Tasks</div>

        <!-- Add task row -->
        <div class="todo__add-row">
          <input type="text" id="todo-input"
                 placeholder="Add a new task…"
                 maxlength="300"
                 aria-label="New task text">
          <button class="btn btn--primary" id="todo-add-btn"
                  aria-label="Add task">
            + Add
          </button>
        </div>

        <!-- Sort row -->
        <div class="todo__sort-row">
          <label for="todo-sort">Sort by:</label>
          <select id="todo-sort" aria-label="Sort tasks">
            <option value="default">Default (newest added)</option>
            <option value="oldest">Oldest first</option>
            <option value="newest">Newest first</option>
            <option value="alpha">A → Z</option>
            <option value="alpha-desc">Z → A</option>
          </select>
        </div>

        <!-- Task list -->
        <ul class="todo__list" id="todo-list" aria-label="Task list" aria-live="polite">
          <!-- populated by JS -->
        </ul>

        <div class="todo__stats" id="todo-stats" aria-live="polite"></div>
      </section>

      <!-- ── QUICK LINKS ────────────────────────────────── -->
      <section class="card col-4" aria-label="Quick links">
        <div class="card__title">🔗 Quick Links</div>

        <!-- Add link form -->
        <div class="links__add-form">
          <input type="text" id="link-label-input"
                 placeholder="Label (optional)"
                 maxlength="60"
                 aria-label="Link label">
          <input type="url" id="link-url-input"
                 placeholder="https://example.com"
                 aria-label="Link URL">
          <button class="btn btn--primary links__add-btn" id="link-add-btn"
                  aria-label="Add quick link">
            + Add Link
          </button>
        </div>

        <!-- Links grid -->
        <div class="links__grid" id="links-grid" aria-label="Saved links">
          <!-- populated by JS -->
        </div>
      </section>

    </div><!-- /grid -->
  </div><!-- /dashboard -->

  <!-- ========================================================
       NAME EDIT MODAL
  ======================================================== -->
  <div class="modal-overlay" id="name-modal-overlay"
       role="dialog" aria-modal="true"
       aria-labelledby="name-modal-title">
    <div class="modal">
      <div class="modal__title" id="name-modal-title">Personalise your greeting</div>
      <input type="text" id="name-modal-input"
             placeholder="Enter your name…"
             maxlength="50"
             aria-label="Your name">
      <div class="modal__actions">
        <button class="btn btn--neutral" id="name-modal-cancel">Cancel</button>
        <button class="btn btn--primary" id="name-modal-save">Save</button>
      </div>
    </div>
  </div>

  <!-- ========================================================
       TOAST
  ======================================================== -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/script.js"></script>
</body>
</html>
